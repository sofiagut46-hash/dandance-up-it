<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Cascade: Cyberpunk Rhythm</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://www.youtube.com/iframe_api"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --neon-cyan: #00ffff;
            --neon-magenta: #ff00ff;
            --neon-yellow: #ffff00;
            --dark-bg: #050510;
        }
        body {
            margin: 0; overflow: hidden; background-color: var(--dark-bg);
            color: white; font-family: 'Orbitron', sans-serif; user-select: none;
        }
        #canvas-container { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1; }
        .ui-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 10; pointer-events: none; display: flex; flex-direction: column;
            transition: opacity 0.3s ease;
        }
        .pointer-events-auto { pointer-events: auto; }
        
        .cyber-panel {
            background: rgba(5, 5, 15, 0.85);
            backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(0, 255, 255, 0.3);
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.1), inset 0 0 15px rgba(255, 0, 255, 0.05);
            border-radius: 8px;
        }
        .cyber-input {
            background: rgba(0, 0, 0, 0.7); border: 1px solid var(--neon-cyan);
            color: var(--neon-cyan); transition: all 0.2s; font-family: 'Orbitron', sans-serif;
        }
        .cyber-input:focus { 
            outline: none; box-shadow: 0 0 15px var(--neon-cyan); 
            background: rgba(0, 255, 255, 0.1);
        }
        .cyber-btn {
            background: linear-gradient(45deg, rgba(255,0,255,0.2), rgba(0,255,255,0.2));
            border: 1px solid var(--neon-cyan); color: white;
            text-shadow: 0 0 5px var(--neon-cyan); transition: all 0.2s ease; cursor: pointer;
            text-transform: uppercase; font-weight: bold;
        }
        .cyber-btn:hover {
            background: linear-gradient(45deg, rgba(255,0,255,0.4), rgba(0,255,255,0.4));
            box-shadow: 0 0 15px var(--neon-cyan), inset 0 0 10px var(--neon-magenta);
            transform: scale(1.02);
        }
        .cyber-btn:active { transform: scale(0.98); }
        #youtube-container { display: none; }

        @keyframes judgment-popup {
            0% { transform: scale(0.5) translateY(20px); opacity: 0; filter: blur(4px); }
            20% { transform: scale(1.4) translateY(-10px); opacity: 1; filter: blur(0px); text-shadow: 0 0 20px currentColor, 0 0 40px currentColor; }
            40% { transform: scale(1.0) translateY(0px); opacity: 1; text-shadow: 0 0 10px currentColor; }
            80% { transform: scale(1.0) translateY(0px); opacity: 1; }
            100% { transform: scale(0.8) translateY(-20px); opacity: 0; filter: blur(2px); }
        }
        .judgment-anim {
            animation: judgment-popup 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            position: absolute; font-weight: 900; font-style: italic; text-transform: uppercase;
            pointer-events: none; transform-origin: center;
        }
        @keyframes combo-pulse {
            0% { transform: scale(1); text-shadow: 0 0 10px var(--neon-magenta); }
            50% { transform: scale(1.3); text-shadow: 0 0 30px var(--neon-cyan), 0 0 50px var(--neon-cyan); }
            100% { transform: scale(1); text-shadow: 0 0 10px var(--neon-magenta); }
        }
        .combo-anim { animation: combo-pulse 0.15s ease-out; }
    </style>
</head>
<body>

    <div id="hud-layer" class="ui-layer justify-between p-6 opacity-0 hidden">
        <div class="flex justify-between items-start w-full">
            <div class="cyber-panel px-6 py-3 pointer-events-auto">
                <h1 class="text-2xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-fuchsia-500">NEON CASCADE</h1>
                <p class="text-[10px] text-cyan-300 tracking-[0.3em]">NEURO-LINK ACTIVE</p>
            </div>
            <div class="flex gap-4 pointer-events-auto">
                <button id="btn-pause-hud" class="cyber-panel cyber-btn px-4 py-2 text-xl">||</button>
                <div class="cyber-panel px-6 py-2 text-right min-w-[160px]">
                    <p class="text-[10px] text-fuchsia-400 tracking-[0.2em] mb-1">SCORE</p>
                    <p class="text-3xl font-bold text-white tracking-wider" id="score-display">0</p>
                </div>
            </div>
        </div>
        
        <div class="flex flex-col items-center justify-center mb-40 h-full relative" id="judgment-container">
            <div id="combo-display" class="absolute top-1/3 flex flex-col items-center opacity-0 transition-opacity">
                <span class="text-7xl font-black italic tracking-tighter text-transparent bg-clip-text bg-gradient-to-b from-white to-cyan-300" id="combo-number">0</span>
                <span class="text-lg font-bold tracking-[0.4em] text-fuchsia-500 mt-1">COMBO</span>
            </div>
        </div>
    </div>

    <div id="menu-layer" class="ui-layer items-center justify-center pointer-events-auto z-50 transition-opacity duration-300">
        <div class="absolute inset-0 bg-black/80 pointer-events-none"></div>
        <div class="cyber-panel p-8 w-full max-w-lg relative overflow-hidden pointer-events-auto">
            <h2 class="text-5xl font-black mb-2 text-center text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 via-fuchsia-500 to-yellow-400 drop-shadow-[0_0_15px_rgba(0,255,255,0.5)]">NEON CASCADE</h2>
            <p class="text-cyan-400 text-center mb-8 text-xs font-bold tracking-[0.3em] border-b border-cyan-900 pb-4">CYBERPUNK PROTOCOL</p>
            
            <div class="space-y-4 mb-8">
                <div>
                    <label class="block text-[10px] tracking-[0.2em] text-fuchsia-400 mb-1">YOUTUBE BGM URL</label>
                    <input type="text" id="yt-input" class="cyber-input w-full px-4 py-2 text-sm" placeholder="URL..." value="jfKfPfyJRdk">
                </div>
                <div class="flex gap-4">
                    <div class="flex-1">
                        <label class="block text-[10px] tracking-[0.2em] text-fuchsia-400 mb-1">BPM</label>
                        <input type="number" id="bpm-input" class="cyber-input w-full px-4 py-2 text-sm" value="120">
                    </div>
                    <div class="flex-1">
                        <label class="block text-[10px] tracking-[0.2em] text-cyan-400 mb-1">DIFFICULTY</label>
                        <select id="diff-input" class="cyber-input w-full px-4 py-2 text-sm appearance-none">
                            <option value="easy">Fácil</option>
                            <option value="normal" selected>Normal</option>
                            <option value="medium">Medio</option>
                            <option value="hard">Difícil</option>
                        </select>
                    </div>
                </div>
            </div>
            
            <button id="btn-start" class="cyber-btn w-full py-4 text-lg mb-6">INITIATE LINK (NUM 5)</button>
            
            <div class="grid grid-cols-4 gap-2 text-center text-[10px] font-bold tracking-wider">
                <div class="text-purple-500 bg-purple-900/30 py-2 border border-purple-500/30">LEFT<br>NUM 4</div>
                <div class="text-yellow-400 bg-yellow-900/30 py-2 border border-yellow-400/30">DOWN<br>NUM 2</div>
                <div class="text-cyan-400 bg-cyan-900/30 py-2 border border-cyan-400/30">UP<br>NUM 8</div>
                <div class="text-pink-500 bg-pink-900/30 py-2 border border-pink-500/30">RIGHT<br>NUM 6</div>
            </div>
        </div>
    </div>

    <div id="pause-layer" class="ui-layer items-center justify-center pointer-events-auto z-50 hidden opacity-0 transition-opacity duration-300">
        <div class="absolute inset-0 bg-black/90 pointer-events-none backdrop-blur-sm"></div>
        <div class="cyber-panel p-10 w-full max-w-sm text-center pointer-events-auto border-fuchsia-500">
            <h2 class="text-4xl font-black mb-8 text-fuchsia-500 tracking-[0.2em] drop-shadow-[0_0_10px_rgba(255,0,255,0.8)]">SYSTEM PAUSED</h2>
            <div class="space-y-4 flex flex-col">
                <button id="btn-resume" class="cyber-btn w-full py-3">RESUME LINK</button>
                <button id="btn-restart" class="cyber-btn w-full py-3 opacity-80">REBOOT TRACK</button>
                <button id="btn-change-song" class="cyber-btn w-full py-3 !border-red-500 !text-red-400 opacity-80">DISCONNECT</button>
            </div>
        </div>
    </div>

    <div id="canvas-container"></div>
    <div id="youtube-container"><div id="yt-player"></div></div>

    <script>
        const STATE = { MENU: 0, PLAYING: 1, PAUSED: 2, GAMEOVER: 3 };
        let currentState = STATE.MENU;
        let score = 0;
        let combo = 0;
        
        // Rhythm logic based on precise time calculation
        let currentBPM = 120;
        let beatInterval = 500; // ms per beat
        let songTime = 0;       // exact ms elapsed since track start
        let nextBeatTime = 0;
        
        let diffSettings = { speedMult: 1.0, subBeats: 1, doubleChance: 0 };
        const FALL_TIME_MS = 2000; // Time in ms a note takes to reach receptor (baseline)
        
        const SPAWN_Z = -80;
        const RECEPTOR_Z = 10;
        const TRACK_LENGTH = Math.abs(SPAWN_Z - RECEPTOR_Z);
        
        const scheduledNotes = []; // { hitTime, laneIndex, mesh, isHit, zPos }
        
        // Colors mapped to prompt: Numpad 4 (Left, Purple), 8 (Up, Cyan), 2 (Down, Yellow), 6 (Right, Pink)
        // Arranged left to right visually on screen: 4, 2, 8, 6.
        const LANES = [
            { id: 'LEFT',  x: -6.0, color: 0xb5179e, key: 'Numpad4', alt: 'ArrowLeft', rot: Math.PI/2 },  // Purple
            { id: 'DOWN',  x: -2.0, color: 0xfcefb4, key: 'Numpad2', alt: 'ArrowDown', rot: Math.PI },    // Yellow
            { id: 'UP',    x:  2.0, color: 0x4cc9f0, key: 'Numpad8', alt: 'ArrowUp',   rot: 0 },          // Cyan
            { id: 'RIGHT', x:  6.0, color: 0xf72585, key: 'Numpad6', alt: 'ArrowRight',rot: -Math.PI/2 }  // Pink
        ];
        const receptors = [];

        // YouTube Setup
        let ytPlayer;
        let isYtReady = false;
        window.onYouTubeIframeAPIReady = function() {
            ytPlayer = new YT.Player('yt-player', {
                height: '0', width: '0', videoId: '',
                playerVars: { 'autoplay': 0, 'controls': 0, 'disablekb': 1 },
                events: { 'onReady': () => { isYtReady = true; } }
            });
        };
        function parseYouTubeID(url) {
            const match = url.match(/^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/);
            return (match && match[2].length === 11) ? match[2] : url;
        }

        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x050510, 0.015); // Cyberpunk neon fade distance

        const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 200);
        camera.position.set(0, 15, 25);
        camera.lookAt(0, 0, -20);

        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        container.appendChild(renderer.domElement);

        // Lighting
        const ambientLight = new THREE.AmbientLight(0x100520, 1.5); // Deep purple ambient
        scene.add(ambientLight);
        
        const centerLight = new THREE.PointLight(0x00ffff, 1, 100);
        centerLight.position.set(0, 20, -20);
        scene.add(centerLight);

        // Moving Neon Grid
        const gridGroup = new THREE.Group();
        scene.add(gridGroup);
        const gridHelper = new THREE.GridHelper(200, 40, 0xff00ff, 0x00ffff);
        gridHelper.position.y = -0.1;
        gridGroup.add(gridHelper);
        
        // Track Base
        const trackGeo = new THREE.BoxGeometry(18, 0.2, 120);
        const trackMat = new THREE.MeshBasicMaterial({ color: 0x020205, transparent: true, opacity: 0.8 });
        const track = new THREE.Mesh(trackGeo, trackMat);
        track.position.set(0, -0.2, -30);
        scene.add(track);

        // Skyscrapers Generator
        const buildingGeo = new THREE.BoxGeometry(1, 1, 1);
        const buildingMat = new THREE.MeshPhongMaterial({ color: 0x050510, flatShading: true });
        const buildings = new THREE.Group();
        scene.add(buildings);

        for (let i = 0; i < 40; i++) {
            const w = 4 + Math.random() * 6;
            const h = 10 + Math.random() * 40;
            const d = 4 + Math.random() * 6;
            
            const b = new THREE.Mesh(buildingGeo, buildingMat);
            b.scale.set(w, h, d);
            
            const xOffset = 20 + Math.random() * 40;
            const xPos = Math.random() > 0.5 ? xOffset : -xOffset;
            const zPos = 10 - Math.random() * 120;
            
            b.position.set(xPos, h/2 - 1, zPos);
            
            // Neon Edges
            const edges = new THREE.EdgesGeometry(buildingGeo);
            const edgeColor = Math.random() > 0.5 ? 0x00ffff : 0xff00ff;
            const line = new THREE.LineSegments(edges, new THREE.LineBasicMaterial({ color: edgeColor, transparent: true, opacity: 0.5 }));
            b.add(line);
            
            buildings.add(b);
        }

        // Floating Particles
        const particleGeo = new THREE.BufferGeometry();
        const partCount = 300;
        const partPos = new Float32Array(partCount * 3);
        for(let i=0; i<partCount*3; i+=3) {
            partPos[i] = (Math.random() - 0.5) * 100;
            partPos[i+1] = Math.random() * 40;
            partPos[i+2] = 20 - Math.random() * 100;
        }
        particleGeo.setAttribute('position', new THREE.BufferAttribute(partPos, 3));
        const particleMat = new THREE.PointsMaterial({ color: 0x00ffff, size: 0.3, transparent: true, opacity: 0.6 });
        const particles = new THREE.Points(particleGeo, particleMat);
        scene.add(particles);

        function generatePixelTexture() {
            const size = 16;
            const canvas = document.createElement('canvas');
            canvas.width = size; canvas.height = size;
            const ctx = canvas.getContext('2d');
            
            const colors = ['#00ffff', '#ff00ff', '#ffff00', '#ffffff'];
            const mainColor = colors[Math.floor(Math.random() * colors.length)];
            
            for(let x=0; x<size/2; x++) {
                for(let y=0; y<size; y++) {
                    // Simple procedural shape generation
                    if(Math.random() > 0.4 && y > 2 && y < 14) {
                        ctx.fillStyle = mainColor;
                        // Add some shading occasionally
                        if(Math.random() > 0.8) ctx.fillStyle = '#ffffff'; 
                        
                        ctx.fillRect(x, y, 1, 1);
                        ctx.fillRect(size - 1 - x, y, 1, 1); // Symmetry
                    }
                }
            }
            // Eyes
            ctx.fillStyle = '#000000';
            ctx.fillRect(4, 5, 2, 2);
            ctx.fillRect(10, 5, 2, 2);

            const texture = new THREE.CanvasTexture(canvas);
            texture.magFilter = THREE.NearestFilter; // Sharp 8-bit look
            return texture;
        }

        // Character Manager (Sprites and Juggling)
        const characters = [];
        function spawnPixelCharacter() {
            const charGroup = new THREE.Group();
            
            // Body
            const bodyMat = new THREE.SpriteMaterial({ map: generatePixelTexture() });
            const body = new THREE.Sprite(bodyMat);
            body.scale.set(6, 6, 1);
            charGroup.add(body);
            
            // Juggle Balls
            const ballTex = generatePixelTexture(); // Reuse generator for small block
            const balls = [];
            for(let i=0; i<3; i++) {
                const b = new THREE.Sprite(new THREE.SpriteMaterial({map: ballTex, color: Math.random()*0xffffff}));
                b.scale.set(1.5, 1.5, 1);
                charGroup.add(b);
                balls.push({ sprite: b, offset: (i * Math.PI * 2) / 3 });
            }

            const xDir = Math.random() > 0.5 ? 1 : -1;
            charGroup.position.set(xDir * (12 + Math.random()*5), 3, -20 - Math.random()*40);
            scene.add(charGroup);
            
            characters.push({
                group: charGroup,
                body: body,
                balls: balls,
                spawnTime: songTime,
                baseY: 3,
                speed: 0.5 + Math.random() * 0.5
            });
        }

        function createNeonArrowGeo() {
            const shape = new THREE.Shape();
            shape.moveTo(0, 2.0); shape.lineTo(2.4, -0.6); shape.lineTo(1.2, -0.6);
            shape.lineTo(1.2, -2.0); shape.lineTo(-1.2, -2.0); shape.lineTo(-1.2, -0.6);
            shape.lineTo(-2.4, -0.6); shape.closePath();
            return new THREE.ExtrudeGeometry(shape, { depth: 0.4, bevelEnabled: false });
        }
        const arrowGeo = createNeonArrowGeo();
        const noteGroup = new THREE.Group();
        scene.add(noteGroup);

        LANES.forEach((lane, index) => {
            // Receptor base
            const outlineMat = new THREE.MeshBasicMaterial({ color: lane.color, wireframe: true, transparent: true, opacity: 0.5 });
            const mesh = new THREE.Mesh(arrowGeo, outlineMat);
            mesh.position.set(lane.x, 0.2, RECEPTOR_Z);
            mesh.rotation.x = -Math.PI / 2;
            mesh.rotation.z = lane.rot;
            scene.add(mesh);

            // Inner flash fill
            const fillMat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0 });
            const fillMesh = new THREE.Mesh(arrowGeo, fillMat);
            fillMesh.position.set(lane.x, 0.21, RECEPTOR_Z);
            fillMesh.rotation.x = -Math.PI / 2;
            fillMesh.rotation.z = lane.rot;
            scene.add(fillMesh);

            receptors.push({ mesh, fillMesh, baseColor: lane.color });
        });

        function spawnNote(laneIndex, targetHitTime) {
            const lane = LANES[laneIndex];
            // Solid neon material
            const mat = new THREE.MeshBasicMaterial({ color: lane.color });
            const mesh = new THREE.Mesh(arrowGeo, mat);
            
            // Initial position will be recalculated in animate loop based on time
            mesh.position.set(lane.x, 0.5, SPAWN_Z);
            mesh.rotation.x = -Math.PI / 2;
            mesh.rotation.z = lane.rot;
            noteGroup.add(mesh);

            scheduledNotes.push({
                hitTime: targetHitTime,
                laneIndex: laneIndex,
                mesh: mesh,
                isHit: false
            });
        }

        function showJudgment(text, hexColor, laneX) {
            const container = document.getElementById('judgment-container');
            const el = document.createElement('div');
            el.className = `judgment-anim text-5xl`;
            el.innerText = text;
            el.style.color = hexColor;
            
            const offset = (laneX / 6) * 50; 
            el.style.left = `calc(50% + ${offset}px - 60px)`;
            el.style.top = '40%';
            container.appendChild(el);
            setTimeout(() => el.remove(), 600);

            const comboContainer = document.getElementById('combo-display');
            const comboNum = document.getElementById('combo-number');
            if (combo > 3) {
                comboContainer.style.opacity = 1;
                comboNum.innerText = combo;
                comboNum.style.color = hexColor;
                comboNum.classList.remove('combo-anim');
                void comboNum.offsetWidth;
                comboNum.classList.add('combo-anim');
            } else {
                comboContainer.style.opacity = 0;
            }
        }

        function triggerReceptorFlash(index, isHit) {
            const rec = receptors[index];
            rec.fillMesh.material.opacity = isHit ? 0.8 : 0.2;
            rec.fillMesh.material.color.setHex(isHit ? 0xffffff : 0xff0000);
            rec.mesh.position.y = 0.0;
            
            setTimeout(() => {
                rec.fillMesh.material.opacity = 0;
                rec.mesh.position.y = 0.2;
            }, 100);
        }

        function handleInput(keyCode) {
            if (currentState !== STATE.PLAYING) return;
            const laneIndex = LANES.findIndex(l => l.key === keyCode || l.alt === keyCode);
            if (laneIndex === -1) return;

            let nearestNote = null;
            let minTimeDiff = Infinity;

            for (let i = 0; i < scheduledNotes.length; i++) {
                const note = scheduledNotes[i];
                if (note.laneIndex === laneIndex && !note.isHit) {
                    const timeDiff = Math.abs(note.hitTime - songTime);
                    if (timeDiff < minTimeDiff && timeDiff < 200) { // 200ms Hit window
                        minTimeDiff = timeDiff;
                        nearestNote = note;
                    }
                }
            }

            if (nearestNote) {
                nearestNote.isHit = true;
                noteGroup.remove(nearestNote.mesh);

                let quality = 'MISS';
                let pts = 0;
                let colorHex = '#ff0000';

                if (minTimeDiff < 40) { quality = 'PERFECT'; pts = 300; colorHex = '#00ffff'; combo++; }
                else if (minTimeDiff < 90) { quality = 'GREAT'; pts = 100; colorHex = '#ff00ff'; combo++; }
                else if (minTimeDiff < 150) { quality = 'GOOD'; pts = 50; colorHex = '#ffff00'; combo++; }
                else { quality = 'MISS'; combo = 0; document.getElementById('combo-display').style.opacity = 0; }

                score += pts * (combo > 0 ? combo : 1);
                document.getElementById('score-display').innerText = score;
                showJudgment(quality, colorHex, LANES[laneIndex].x);
                triggerReceptorFlash(laneIndex, true);
            } else {
                triggerReceptorFlash(laneIndex, false);
                combo = 0; document.getElementById('combo-display').style.opacity = 0;
            }
        }

        function toggleLayer(id, show) {
            const el = document.getElementById(id);
            if(show) { el.classList.remove('hidden'); void el.offsetWidth; el.style.opacity = '1'; } 
            else { el.style.opacity = '0'; setTimeout(() => el.classList.add('hidden'), 300); }
        }

        function applyDifficulty(level) {
            switch(level) {
                case 'easy': diffSettings = { speedMult: 0.6, subBeats: 1, doubleChance: 0.0 }; break;
                case 'normal': diffSettings = { speedMult: 1.0, subBeats: 1, doubleChance: 0.0 }; break;
                case 'medium': diffSettings = { speedMult: 1.4, subBeats: 2, doubleChance: 0.1 }; break;
                case 'hard': diffSettings = { speedMult: 2.0, subBeats: 2, doubleChance: 0.3 }; break;
            }
        }

        function startGame() {
            currentBPM = parseInt(document.getElementById('bpm-input').value) || 120;
            beatInterval = 60000 / currentBPM;
            applyDifficulty(document.getElementById('diff-input').value);
            
            score = 0; combo = 0; songTime = 0;
            nextBeatTime = FALL_TIME_MS / diffSettings.speedMult; 
            document.getElementById('score-display').innerText = score;
            document.getElementById('combo-display').style.opacity = 0;
            
            scheduledNotes.forEach(n => noteGroup.remove(n.mesh));
            scheduledNotes.length = 0;
            characters.forEach(c => scene.remove(c.group));
            characters.length = 0;

            const ytVal = document.getElementById('yt-input').value;
            if(isYtReady && ytVal) {
                ytPlayer.loadVideoById(parseYouTubeID(ytVal));
                ytPlayer.playVideo();
            }

            toggleLayer('menu-layer', false); toggleLayer('pause-layer', false); toggleLayer('hud-layer', true);
            currentState = STATE.PLAYING;
            lastSysTime = performance.now();
        }

        function togglePause() {
            if (currentState === STATE.MENU || currentState === STATE.GAMEOVER) return;
            if (currentState === STATE.PAUSED) {
                toggleLayer('pause-layer', false);
                if(isYtReady && ytPlayer.playVideo) ytPlayer.playVideo();
                currentState = STATE.PLAYING;
                lastSysTime = performance.now();
            } else {
                currentState = STATE.PAUSED;
                toggleLayer('pause-layer', true);
                if(isYtReady && ytPlayer.pauseVideo) ytPlayer.pauseVideo();
            }
        }

        window.addEventListener('keydown', (e) => {
            if (e.repeat) return;
            if (e.code === 'Escape') { togglePause(); return; }
            if (e.code === 'Numpad5' && currentState === STATE.MENU) { startGame(); return; }
            if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code)) e.preventDefault();
            handleInput(e.code);
        });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        document.getElementById('btn-start').addEventListener('click', startGame);
        document.getElementById('btn-pause-hud').addEventListener('click', togglePause);
        document.getElementById('btn-resume').addEventListener('click', togglePause);
        document.getElementById('btn-restart').addEventListener('click', startGame);
        document.getElementById('btn-change-song').addEventListener('click', () => {
            if(isYtReady && ytPlayer.stopVideo) ytPlayer.stopVideo();
            toggleLayer('pause-layer', false); toggleLayer('hud-layer', false); toggleLayer('menu-layer', true);
            currentState = STATE.MENU;
        });

        let lastSysTime = performance.now();

        function animate() {
            requestAnimationFrame(animate);
            const now = performance.now();
            let delta = 0;

            if (currentState === STATE.PLAYING) {
                delta = now - lastSysTime;
                songTime += delta;
                
                const timeFall = FALL_TIME_MS / diffSettings.speedMult;

                // Spawner Logic
                if (songTime + timeFall >= nextBeatTime) {
                    const beatFraction = beatInterval / diffSettings.subBeats;
                    
                    // Spawn logic based on difficulty
                    if(Math.random() < 0.8) { // 80% chance to spawn on valid beats
                        const lane1 = Math.floor(Math.random() * LANES.length);
                        spawnNote(lane1, nextBeatTime);
                        
                        if(Math.random() < diffSettings.doubleChance) {
                            let lane2 = Math.floor(Math.random() * LANES.length);
                            while(lane2 === lane1) lane2 = Math.floor(Math.random() * LANES.length);
                            spawnNote(lane2, nextBeatTime);
                        }
                    }
                    
                    // Character spawning
                    if(Math.random() < 0.05 && characters.length < 4) spawnPixelCharacter();

                    nextBeatTime += beatFraction;
                }

                // Update Notes based on strict time calculation
                for (let i = scheduledNotes.length - 1; i >= 0; i--) {
                    const note = scheduledNotes[i];
                    if (note.isHit) { scheduledNotes.splice(i, 1); continue; }

                    const timeRemaining = note.hitTime - songTime;
                    
                    if (timeRemaining < -200) { // Missed completely
                        showJudgment('MISS', '#ff0000', LANES[note.laneIndex].x);
                        combo = 0; document.getElementById('combo-display').style.opacity = 0;
                        noteGroup.remove(note.mesh);
                        scheduledNotes.splice(i, 1);
                        continue;
                    }

                    // Perfect visual sync: Calculate Z based on time remaining
                    const progress = 1 - (timeRemaining / timeFall);
                    note.mesh.position.z = SPAWN_Z + (TRACK_LENGTH * progress);
                }

                // Update Characters (Juggling & Bobbing)
                for (let i = characters.length - 1; i >= 0; i--) {
                    const char = characters[i];
                    const t = (songTime - char.spawnTime) / 1000;
                    
                    // Bobbing to beat
                    char.body.position.y = char.baseY + Math.abs(Math.sin(songTime * Math.PI / beatInterval)) * 1.5;
                    
                    // Juggling balls
                    char.balls.forEach(ball => {
                        ball.sprite.position.x = Math.cos(t * 3 + ball.offset) * 3;
                        ball.sprite.position.y = char.baseY + 4 + Math.sin(t * 3 + ball.offset) * 2;
                    });
                    
                    // Move forward slowly
                    char.group.position.z += char.speed * (delta / 10);
                    if(char.group.position.z > 20) {
                        scene.remove(char.group);
                        characters.splice(i, 1);
                    }
                }
            }
            lastSysTime = now;

            // Environment Animation (Always running)
            const globalTime = now / 1000;
            gridHelper.position.z = (globalTime * 20 * diffSettings.speedMult) % 10;
            
            // Move particles towards camera
            const positions = particles.geometry.attributes.position.array;
            for(let i=2; i<positions.length; i+=3) {
                positions[i] += 0.5;
                if(positions[i] > 20) {
                    positions[i] = -100;
                    positions[i-1] = Math.random() * 40; // new Y
                    positions[i-2] = (Math.random() - 0.5) * 100; // new X
                }
            }
            particles.geometry.attributes.position.needsUpdate = true;

            renderer.render(scene, camera);
        }

        window.onload = animate;
    </script>
</body>
</html>
